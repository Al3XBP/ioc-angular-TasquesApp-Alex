<div class="targeta" role="article" aria-label="Informació de l'element">
  <img [src]="element.imatgeUrl" [alt]="element.titol" class="imatge-element" />

  <h3>{{ element.titol | uppercase }}</h3>

  <p><strong>Categoria:</strong> {{ element.categoria }}</p>
  <p><strong>Preu:</strong> {{ element.preu | number:'1.0-0' }}</p>
  <p><strong>Unitats:</strong> {{ element.unitats }}</p>
  <p><strong>Popular:</strong> {{ element.esPopular ? 'Sí' : 'No' }}</p>
  <p><strong>Descripció:</strong> {{ element.descripcio }}</p>
</div>
