<h1>Catàleg d'elements</h1>

<section class="panell-preferits">
  <h2>Preferits</h2>
  <p><strong>Total:</strong> {{ preferitsService.totalPreferits() }}</p>

  <ul *ngIf="preferitsService.preferits().length > 0; else sensePreferits">
    <li *ngFor="let preferit of preferitsService.preferits()">
      {{ preferit.titol }}
    </li>
  </ul>

  <ng-template #sensePreferits>
    <p>No hi ha preferits seleccionats.</p>
  </ng-template>
</section>

<app-formulari-cerca
  (cercaCanviada)="gestionarCerca($event)">
</app-formulari-cerca>

<!-- CARREGANT -->
<div *ngIf="elementService.carregant()">
  <p class="spinner">⏳ Carregant dades...</p>
</div>

<!-- ERROR -->
<div *ngIf="elementService.error()">
  <p class="error">{{ elementService.error() }}</p>
  <button (click)="reintentar()">Reintentar</button>
</div>

<!-- ÈXIT -->
<div *ngIf="!elementService.carregant() && !elementService.error()" class="grid-elements">
  <app-targeta-element
    *ngFor="let element of elementService.elements()"
    [element]="element">
  </app-targeta-element>
</div>
