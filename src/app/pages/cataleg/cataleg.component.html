<h1>Catàleg</h1>

<p>Llistat virtualitzat amb Angular CDK.</p>

<cdk-virtual-scroll-viewport
  [itemSize]="alturaElement" style="height: 500px;"
  class="viewport">

  <div *cdkVirtualFor="let element of elements" class="element-virtual">

    <app-targeta-element
      [element]="element">
    </app-targeta-element>

  </div>

</cdk-virtual-scroll-viewport>
